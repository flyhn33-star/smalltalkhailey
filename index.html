<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7f5a49">
<title>The Fluent Me</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b2523;--mute:#7a6d66;--br:#7e5a48;--br-d:#5f4334;--br-l:#efe6de;--teal:#1e7a7a;--teal-l:#e3f1f0;--amber:#de9b2e;--amber-l:#fdf3dc;--red:#b4513e;--red-l:#fbe9e7;--line:#e6dfd7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;word-break:keep-all}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lg{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 4px 18px rgba(0,0,0,.08);text-align:center}
.lg h1{font-family:Georgia,serif;font-size:28px;margin:0 0 4px;color:var(--br-d)}
.lg p{color:var(--mute);font-size:14px;margin:0 0 18px}
.lg input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:10px}
.lg .err{color:var(--red);font-size:14px;min-height:20px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;background:var(--br);color:#fff}
.btn.w{width:100%}.btn.sec{background:#fff;color:var(--br-d);border:2px solid var(--br)}.btn.sm{padding:7px 12px;font-size:14px}.btn.gray{background:#eee8e1;color:var(--ink)}
header{background:var(--br);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-family:Georgia,serif;font-size:20px}
header button{background:none;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:18px;padding:4px 12px;font-size:13px}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:8px 12px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:none;background:none;border-radius:18px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--mute);white-space:nowrap}
nav button.on{background:var(--br);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px}
h2{font-family:Georgia,serif;font-size:19px;color:var(--br-d);margin:0 0 10px}
h2 small{font-family:inherit;font-size:13px;color:var(--mute);font-weight:400;margin-left:6px}
.kr{color:var(--mute);font-size:14px}
.hero{background:var(--br);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero .d{font-family:Georgia,serif;font-size:24px;font-weight:700}
.hero .t{font-size:17px;margin-top:4px}
.hero .tag{display:inline-block;background:var(--amber-l);color:#8a5c00;border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.ck:last-child{border:0}
.ck input{width:20px;height:20px;accent-color:var(--br);margin-top:3px;flex:0 0 20px}
.ck .dd{font-size:12.5px;font-weight:700;color:var(--br);display:block}
.ck.done span.tx{color:var(--mute);text-decoration:line-through}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fx .x{background:var(--red-l);color:var(--red);border-radius:10px;padding:8px 12px;font-size:15px}

.fx .r{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.65;color:var(--ink);word-break:keep-all}
.fx .r b{display:inline-block;margin-right:8px;color:var(--teal);font-size:12px;letter-spacing:.04em}
.fx{margin-bottom:14px}
.fx .o{background:var(--teal-l);color:var(--teal);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:18px;padding:6px 13px;font-size:14px;font-weight:700;color:var(--mute)}
.chip.on{border-color:var(--br);background:var(--br);color:#fff}
details{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
summary{padding:15px 18px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .n{display:inline-block;background:var(--br-l);color:var(--br-d);border-radius:8px;padding:1px 9px;font-size:13px;margin-right:8px}
summary::after{content:"▾";color:var(--mute)}
details[open] summary::after{content:"▴"}
.in{padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px dashed var(--line)}
td.w{font-weight:700}td.p{color:var(--red);font-weight:700;font-size:14px}
td.k.blur,.wt td.k.blur{color:transparent!important;background:#eee8e1;border-radius:4px;cursor:pointer;-webkit-user-select:none;user-select:none}
td.k.blur.peek,.wt td.k.blur.peek{color:var(--mute)!important;background:transparent}
.vadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.vadd input[type=text]{flex:1 1 150px;min-width:0;width:auto}
.vr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.vr .vw{font-weight:700;font-size:16px}.vr .vk{color:var(--mute);font-size:15px;display:inline-block;padding:0 4px;margin-top:2px;border-radius:4px}
.vk.blur{color:transparent!important;background:#eee8e1;cursor:pointer;-webkit-user-select:none;user-select:none}.vk.blur.peek{color:var(--mute)!important;background:transparent}
.pq{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff}.pq.ok{border-color:var(--teal);background:var(--teal-l)}.pq.no{border-color:var(--red);background:var(--red-l)}
.pimg{width:100%;max-width:300px;margin:0 auto 6px}.pimg svg{width:100%;height:auto;display:block}.ptx{min-width:0;font-size:16px;line-height:2.15}
.ptx input.pin{max-width:100%;min-height:0;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--br);border-radius:4px;padding:1px 4px;margin:0 2px;font-size:16px;line-height:1.4;background:#fffaf0;font-family:inherit}.ptx input.pin::placeholder{color:#b8aa9c;font-size:13px}.ptx input.pin.ok{border-color:var(--teal);color:var(--teal);font-weight:700}.ptx input.pin.no{border-color:var(--red);color:var(--red);text-decoration:line-through}
.pans{color:var(--teal);font-weight:700;margin:0 4px 0 2px}
#pqpop{position:fixed;inset:0;z-index:70;background:rgba(40,30,25,.35);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.pqcard{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:100%;max-width:380px;max-height:calc(100vh - 110px);overflow:auto;padding:14px}.pqhd{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.pqhd b{font-size:16px;color:var(--br-d)}
@media(min-width:721px){#pqpop{align-items:center;padding:16px}}
.pqbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px dashed var(--br)}.pqbar b{color:var(--br-d)}
.pgs{font-weight:700;color:var(--br-d);margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--line)}.pgs:first-child{margin-top:0;padding-top:0;border-top:0}
.pgr{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}.pgt{min-width:0;overflow-wrap:anywhere}
.pgd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eee8e1;color:var(--mute);font-weight:700}.pgd.on{background:var(--teal);color:#fff}
.pgc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;min-width:54px;cursor:pointer}.pgc input{width:24px;height:24px}.pgc small{display:block;font-weight:400;color:var(--mute);font-size:11px}
td[data-va]{cursor:pointer}.vs{color:var(--amber)}
.cq{padding:12px 0;border-bottom:1px dashed var(--line)}.cq:last-child{border:0}.cq .cs{font-size:17px;font-weight:700;line-height:1.45}
.cq .cr{display:flex;flex-direction:column;gap:2px;padding:6px 0 6px 12px;border-left:3px solid var(--br-l);margin-top:8px}.cq .ce{font-size:16px;font-weight:700}
.ckr{color:var(--mute);font-size:15px;align-self:flex-start;padding:0 4px;border-radius:4px}.ckr.blur{color:transparent!important;background:#eee8e1;cursor:pointer;-webkit-user-select:none;user-select:none}.ckr.blur.peek{color:var(--mute)!important;background:transparent}
.cq .cb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.q{padding:8px 0;border-bottom:1px dashed var(--line);font-size:16px}
.q:last-child{border:0}
.q i{font-style:normal;font-weight:700;color:var(--br);margin-right:6px}
.note{background:var(--amber-l);border-radius:10px;padding:9px 13px;font-size:15px;margin-top:10px}
a.lk{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:11px 14px;text-decoration:none;color:var(--ink);margin-bottom:8px;background:#fff}
a.lk:hover{border-color:var(--br);background:var(--br-l)}
a.lk b{display:block}a.lk span.s{font-size:13px;color:var(--mute)}
.hw{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hw.done{border-color:var(--teal);background:var(--teal-l)}
.hw .ti{font-weight:700;font-size:17px}
.hw .du{display:inline-block;background:var(--amber-l);color:#8a5c00;border-radius:8px;padding:1px 9px;font-size:13px;font-weight:700;margin-top:4px}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:700;font-size:14px;color:var(--br-d);margin:12px 0 4px}
label.f small{font-weight:400;color:var(--mute);margin-left:6px}
.bar{height:12px;background:#eee8e1;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--br)}
.rp{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.rp b{text-align:right}
.score{font-family:Georgia,serif;font-size:48px;font-weight:700;color:var(--br-d);line-height:1}
.msg{font-size:14px;font-weight:700;color:var(--teal);min-height:20px;margin-top:8px}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:20px}
.goal{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.goal.ok{background:var(--teal-l);border-color:transparent}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gh b{flex:1;font-size:17px;line-height:1.35}
.gn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--br);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gc{font-size:13px;font-weight:700;color:var(--br-d);background:var(--br-l);border-radius:10px;padding:2px 10px;white-space:nowrap}
.goal.ok .gc,.pj.ok .gc{background:var(--teal);color:#fff}
.stp{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding:2px 0}
.stp .sr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.au{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:3px;font-size:12px;line-height:17px;text-align:center;color:#fff;box-sizing:border-box}
.au.on{background:var(--teal);border-color:var(--teal)}
.wd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.wd span{background:var(--br-l);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--br-d)}
.wd b{display:block;font-family:Georgia,serif;font-size:22px}
.pj{display:flex;gap:12px;align-items:flex-start;border-top:1px dashed var(--line);padding:12px 0}
.pj:first-of-type{border-top:0}
@keyframes chjump{0%{transform:translateY(0)}35%{transform:translateY(-34px)}55%{transform:translateY(-36px)}100%{transform:translateY(0)}}
#chj.jump{animation:chjump .55s cubic-bezier(.3,.7,.4,1)}
#schbtn{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#schbtn:active{background:rgba(255,255,255,.28)}
.hero>.kr:first-of-type,.hero .d{padding-right:52px}
#schpop{position:fixed;inset:0;z-index:40;background:rgba(43,37,35,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#schpop .card{width:100%;max-width:460px;max-height:86vh;overflow:auto;margin:0}
.scht td{vertical-align:top}
#sinfo{position:absolute;left:8px;top:8px;right:8px;background:rgba(43,37,35,.82);color:#fff;border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.4;pointer-events:none}
#benchbtn{position:absolute;left:39.7%;top:34%;transform:translateX(-50%);box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;min-height:40px}
#chx{transition:transform .3s linear}#chf,#chj,#chb,#che{transform-box:fill-box;transform-origin:50% 100%}
@keyframes chbreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes chlook{0%,62%,100%{transform:translateX(0)}68%,78%{transform:translateX(-2px)}84%,94%{transform:translateX(2px)}}
@keyframes chwalk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes itarrive{0%{transform:translateY(-46px) scale(.6);opacity:0}60%{transform:translateY(3px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes spk{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
#chb{animation:chbreath 3.6s ease-in-out infinite}#che{animation:chlook 9s ease-in-out infinite;transform-origin:50% 50%}
#chj.walk{animation:chwalk .34s linear infinite}
.arrive{animation:itarrive .7s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
.spk{animation:spk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}.spk.s2{animation-delay:1.1s}
.mb{display:grid;grid-template-columns:54px 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-top:6px}.mb b{text-align:right;color:var(--ink)}.mb .bar{height:9px}
.npj{display:flex;gap:12px;align-items:center}.npj svg,.pj svg{flex:0 0 44px;background:#faf6f1;border-radius:12px}
.dex{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.dx{background:#faf6f1;border-radius:10px;padding:5px 1px 4px;text-align:center;min-width:0}.dx svg{width:100%;height:34px;display:block}.dx span{display:block;font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx.ok{background:var(--br-l)}.dx.ok span{color:var(--br-d);font-weight:700}
.pj{align-items:center}.pj.lock{opacity:.6}
#hairsheet{position:fixed;inset:0;z-index:40;background:rgba(43,37,35,.4);display:flex;align-items:flex-end;justify-content:center}
#hairsheet .card{width:100%;max-width:520px;margin:0;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#mg{position:fixed;inset:0;z-index:60;background:rgba(43,37,35,.55);display:none;align-items:center;justify-content:center;padding:14px}
#mg .card{width:100%;max-width:440px;margin:0;max-height:92vh;overflow:auto}
.mgs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.mgs span{font-size:12px;border-radius:9px;padding:3px 9px;background:#f1ebe4;color:var(--mute)}.mgs span.on{background:var(--br);color:#fff;font-weight:700}.mgs span.dn{background:var(--teal-l);color:var(--teal)}
#sawwood{position:relative;height:64px;margin:12px 0 8px}.plank{position:absolute;left:4%;right:4%;top:14px;height:36px;border-radius:6px;background:repeating-linear-gradient(90deg,#dcc19a 0 22px,#d3b68c 22px 24px)}
.plank i{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(127,90,73,.25)}.plank i.cut{width:4px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px #c9b08f}
#gauge{position:relative;height:28px;border-radius:14px;background:#f1ebe4;overflow:hidden}#gauge .zone{position:absolute;left:44%;width:12%;top:0;bottom:0;background:var(--teal-l)}#gauge .line{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--teal)}
#gm{position:absolute;top:3px;width:10px;height:22px;margin-left:-5px;border-radius:5px;background:var(--br);left:0}
#sandbox{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:0;border-radius:10px;overflow:hidden;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.sc{display:block;height:0;padding-top:100%;background:#c9a877;background-image:radial-gradient(#a8845a 1.2px,transparent 1.4px),radial-gradient(#e3caa2 1px,transparent 1.2px);background-size:7px 7px,9px 9px;background-position:0 0,3px 4px;transition:background-color .25s}
.sc.sm{background:#e7cfa4;background-image:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.dst{position:absolute;top:40%;width:5px;height:5px;border-radius:50%;background:#d9b98a;pointer-events:none;animation:dst .65s ease-out forwards}
@keyframes dst{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--dx),34px);opacity:0}}
.mgdone svg{background:#faf6f1;border-radius:18px}
@media(prefers-reduced-motion:reduce){#chb,#che,#chj.walk,.arrive,.spk,.dst{animation:none}}
.aud{margin-top:6px}.audl{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.rec{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}.rec.done{background:#fbf8f4}.rec .ti{font-weight:700;font-size:17px;line-height:1.4}
.hc{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.hc.on{box-shadow:0 0 0 3px var(--br)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .ch{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}
.cd{position:relative;border:1.5px solid transparent;background:#faf6f1;border-radius:10px;min-height:44px;font-size:15px;font-weight:700;color:var(--ink);padding:4px 0 12px}
.cd.cl{background:var(--br-l);color:var(--br-d)}
.cd.td{border-color:var(--amber)}
.cd.on{border-color:var(--br);background:#fff}
.cd.cl.on{background:var(--br-l)}
.cd u.c{background:var(--br)}
.cd i{position:absolute;left:0;right:0;bottom:5px;display:flex;gap:3px;justify-content:center}

.cd u.a,.lg1.a{background:var(--teal)}
.cd u.m,.lg1.m{background:var(--amber)}
.lg1{margin:0 4px 0 10px}
.lg1.cl{background:var(--br);margin-left:0}
.wgt{font-size:13px;font-weight:700;color:var(--br-d);background:var(--br-l);border-radius:8px;padding:4px 10px;margin:14px 0 2px;display:inline-block}
.w2 td.w{width:46%}
button,a,label,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(max-width:720px){.grid,.fx{grid-template-columns:1fr}
html{-webkit-text-size-adjust:100%}
header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));gap:8px}
header b{font-size:18px;white-space:nowrap}
header>span{display:flex;align-items:center;gap:6px;min-width:0}
#who{display:none}

function pqCol(pic){return PMD[pic]||'#6f8f8a'}
function pnorm(s){return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').replace(/[.,!?]+$/,'')}
function picBlanks(it){return it.parts.filter(function(p){return typeof p!=='string'})}
function picRight(it,vals){return picBlanks(it).every(function(p,i){return p.a.indexOf(pnorm((vals||[])[i]))>=0})}
function picHint(p){if(p.v)return '('+p.v+')';return p.a[0].replace(/[A-Za-z]+/g,function(w){return w[0]+new Array(w.length).join('_')})}
function picHtml(it,vals,checked,showKo){var bi=0;return '<div class="pq'+(checked?(picRight(it,vals)?' ok':' no'):'')+'"><div class="pimg">'+(PICS[it.pic]||'').split('#0e0e01').join(pqCol(it.pic))+'</div><div class="ptx">'+it.parts.map(function(p){if(typeof p==='string')return esc(p);var i=bi++,v=(vals||[])[i]||'',ok=checked&&p.a.indexOf(pnorm(v))>=0,hn=picHint(p);return '<input type="text" class="pin'+(checked?(ok?' ok':' no'):'')+'" data-pi="'+i+'" value="'+esc(v)+'" placeholder="'+esc(hn)+'" style="width:'+Math.max(6,Math.min(16,Math.max(hn.length,p.a[0].length)+2))+'ch" aria-label="빈칸 '+(i+1)+' '+esc(hn)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+(checked?' readonly':'')+'>'+(checked&&!ok?'<span class="pans">'+esc(p.a[0])+'</span>':'')}).join('')+(showKo||checked?'<div class="kr" style="margin-top:6px">'+esc(it.ko)+'</div>':'<div style="margin-top:6px"><button class="btn sm gray" data-pko="1">한국어 뜻 보기</button></div>')+'</div></div>'}

 h+='<div class="card"><h2>수업 일정</h2><label class="f">한 줄에 하나<small>날짜 | 장소·방식 | 메모</small></label><textarea id="r_schedule" style="min-height:150px">'+esc(toLines(R.schedule))+'</textarea><h2 style="margin-top:18px">다음 달 일정 제안 <small>학생이 확인 · 확정</small></h2><label class="f">제목<small>예: December 2026</small></label><input type="text" id="r_ptitle" value="'+esc((R.plan||{}).title||'')+'"><label class="f">수업 날짜<small>날짜 | 시간 | 오프라인 또는 줌 | 토픽 · 비우면 제안을 내립니다</small></label><textarea id="r_plan" style="min-height:110px" placeholder="2026-12-05 | 10:00–11:30 | 오프라인 | Life ROI">'+esc(toLines((R.plan||{}).lessons))+'</textarea><label class="f">학생에게 한 줄<small>선택</small></label><input type="text" id="r_pnote" value="'+esc((R.plan||{}).note||'')+'"><h2 style="margin-top:18px">포인트 리워드</h2><label class="f">기준<small>필요 포인트 | 리워드 이름</small></label><input type="text" id="r_reward" value="'+esc(((R.reward&&R.reward[0]>0)?R.reward:[110,'교보문고 5,000원 쿠폰']).join(' | '))+'"><label class="f">시작 포인트<small>이전 사이트에서 가져온 점수</small></label><input type="number" id="r_base" min="0" value="'+(R.base==null?17:(+R.base||0))+'"><label class="f">리워드 지급 기록<small>한 줄에 날짜 하나 · 제출 확인 탭의 버튼으로 추가됩니다</small></label><textarea id="r_redeem" style="min-height:50px">'+esc((R.redeem||[]).join('\n'))+'</textarea><button class="btn" id="rsave" style="margin-top:14px">기록 저장</button><div class="msg" id="rmsg"></div></div></div>';
 h+='<div class="card"><h2>월간 리포트 추가 · 수정 <small>같은 제목이면 덮어써요</small></h2><div class="grid"><div><label class="f">제목</label><input type="text" id="p_title" placeholder="November Final"></div><div><label class="f">날짜</label><input type="date" id="p_date"></div><div><label class="f">총점</label><input type="number" id="p_got"></div><div><label class="f">만점</label><input type="number" id="p_max"></div></div><label class="f">영역별 점수<small>영역 | 점수 | 만점</small></label><textarea id="p_parts"></textarea><label class="f">잘한 것<small>한 줄에 하나</small></label><textarea id="p_good"></textarea><label class="f">보완할 것<small>틀린 것 | 고친 것 | 설명</small></label><textarea id="p_fix"></textarea><label class="f">Teacher\'s comment</label><textarea id="p_comment"></textarea><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" id="psave">리포트 저장</button>'+(D.reports||[]).map(function(r,i){return '<button class="btn sm gray" data-pe="'+i+'">'+esc(r.title)+' 불러오기</button>'}).join('')+'</div><div class="msg" id="pmsg"></div></div>';

 $('rsave').onclick=async function(){var num=function(a,idx){return a.map(function(r){idx.forEach(function(i){var n=r[i]===''?null:+r[i];r[i]=(n===null||!isFinite(n))?null:n});return r})};var okd=function(r){return /^\d{4}-\d{2}-\d{2}$/.test(r[0])};var sc=num(fromLines($('r_scores').value,4),[2,3]),sk2=num(fromLines($('r_speak').value,3),[1,2]),sd=fromLines($('r_schedule').value,3),pl=fromLines($('r_plan').value,4),rd=fromLines($('r_redeem').value,0);var bad=pl.filter(function(r){return !okd(r)}).length+rd.filter(function(r){return !okd([r])}).length+sc.filter(function(r){return !okd(r)||r[2]===null||!(r[3]>0)}).length+sk2.filter(function(r){return !okd(r)||r[1]===null}).length+sd.filter(function(r){return !okd(r)}).length;if(bad){$('rmsg').style.color='var(--red)';$('rmsg').textContent='형식이 맞지 않는 줄이 '+bad+'개 있어요. 날짜는 2026-11-22 형식, 점수·만점은 숫자로 적어주세요.';return}$('rmsg').style.color='';R.scores=sc;R.speak=sk2;R.schedule=sd;pl.sort(function(a,b){return a[0]<b[0]?-1:1});var pt=$('r_ptitle').value.trim()||(pl.length?(+pl[0][0].slice(5,7))+'월':'');R.plan=pl.length?{id:hsh(pt+'|'+JSON.stringify(pl)),title:pt,note:$('r_pnote').value.trim(),lessons:pl}:null;var rw=$('r_reward').value.split('|').map(function(x){return x.trim()});R.reward=[+rw[0]>0?Math.round(+rw[0]):110,rw[1]||'교보문고 5,000원 쿠폰'];R.redeem=rd;var bs=+$('r_base').value;R.base=bs>0&&isFinite(bs)?Math.round(bs):0;var g=$('r_goal').value.split('|').map(function(x){return +x.trim()});R.goal=[g[0]>0?g[0]:900,g[1]>0?g[1]:1400];var ok=await saveData();$('rmsg').textContent=ok?'저장됐어요 ✓ (온라인)':'이 기기에만 저장됐어요.'};
 [].forEach.call(document.querySelectorAll('[data-pe]'),function(b){b.onclick=function(){var r=D.reports[+b.dataset.pe];$('p_title').value=r.title;$('p_date').value=r.date;$('p_got').value=r.got;$('p_max').value=r.max;$('p_parts').value=toLines(r.parts);$('p_good').value=toLines(r.good);$('p_fix').value=toLines(r.fix);$('p_comment').value=r.comment||''}});
 $('psave').onclick=async function(){var t=$('p_title').value.trim(),d=$('p_date').value;if(!t||!d||!$('p_max').value){$('pmsg').textContent='제목, 날짜, 만점은 꼭 넣어주세요.';return}
  var r={id:d.slice(0,7)+'_'+t,title:t,date:d,got:+$('p_got').value,max:+$('p_max').value,parts:fromLines($('p_parts').value,3).map(function(p){return [p[0],+p[1],+p[2]]}),good:fromLines($('p_good').value,0),fix:fromLines($('p_fix').value,3),comment:$('p_comment').value.trim()};
  D.reports=(D.reports||[]).filter(function(x){return x.title!==t});D.reports.push(r);D.reports.sort(function(a,b){return a.date<b.date?-1:1});var ok=await saveData();render();$('pmsg').textContent=ok?'저장됐어요 ✓ (온라인)':'이 기기에만 저장됐어요.'}}

/* pick up a newer deployed version even when the browser cached the page */
async function verCheck(){try{if(location.protocol==='file:')return;var r=await fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'});if(!r.ok)return;var m=(await r.text()).match(/var APPVER='([^']+)'/);if(!m||m[1]===APPVER)return;var k='fm2_rl_'+m[1];if(sessionStorage.getItem(k))return;if(typing()){setTimeout(verCheck,60000);return}sessionStorage.setItem(k,'1');location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}catch(e){}}
verCheck();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){verCheck();if(db&&!typing())fbInit()}});
